<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>SGA - Alumnos</title>
        <script src="js/storage.js" defer></script>
        <script src="js/docentes.js" defer></script>
        <script src="js/ui.js" defer></script>

        <link rel="stylesheet" href="css/estilos.css">
    </head>
    <body>
        <header>
            <nav>
                <a href="index.html">Inicio</a>
                <a href="alumnos.html">Alumnos</a>
                <a href="docentes.html">Docentes</a>
            </nav>
        </header>
        <main>
            <h1>Gestion de Docentes</h1>
            <section class="formulario-container">
                <h2>Alta de docente</h2>
                <form id="formulario">
                    <div class="campo"></div>
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre"><br><br>
                    </div>
                    <div class="campo"></div>
                    <label for="especialidad">Especialidad</label>
                    <input type="text" id="especialidad"><br><br>
                    </div>
                    <div class="campo"></div>
                    <label for="correo">Correo electrónico</label>
                    <input type="texto" id="correo"> <br><br>
                    </div>

                    <button type="submit">Guardar Docente</button>
                </form>
                <p id="mensaje" class="oculto"></p>
            </section>
            <section class="lista-container">
                <h2>docente registrados</h2>
                <!-- <p id="cantidadDocentes"></p> -->
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Especialidad</th>
                            <th>Correo</th>
                        </tr>
                    </thead>
                    <tbody id="listaDocentes"></tbody>
                </table>
            </section>
            <div id="mensaje" class="mensaje"></div>
        </main>
    </body>
</html>
