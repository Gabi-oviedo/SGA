<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGA - Alumnos</title>
</head>
<body>
    <header>
            <nav>
                <a href="index.html">Inicio</a>
                <a href="alumnos.html">Alumnos</a>
                <a href="docentes.html">Docentes</a>
            </nav>
        </header>
        <main>
            <section class="formulario">
                <h2>Alta de Alumno</h2>
                <form id="formAlumno">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre"><br><br>

                    <label for="carrera">Carrera</label>
                    <input type="text" id="carrera"><br><br>

                    <label for="correo">Correo electrónico</label>
                    <input type="texto" id="correo"> <br><br>

                    <button type="submit">Guardar Alumno</button>
                </form>
                <p id="mensaje" class="oculto"></p>
            </section>
            <section class="alumnos">
                <h2>Alumnos registrados</h2>
                <p id="cantidadAlumnos"></p>
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Carrera</th>
                            <th>Correo</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="listaAlumnos"></tbody>
                </table>
            </section>
        </main>
</body>
</html>
